[project]
name = "stata-mcp-server"
version = "0.1.0"
description = "MCP server that drives Stata via the pystata DLL bridge"
requires-python = ">=3.10"
dependencies = [
    # server.py 从 fastmcp.tools.base 导入 ToolResult，该模块在 3.2.0 才出现。
    # 实测 3.0.0 / 3.1.0 均 ModuleNotFoundError，import 阶段即崩，不能放宽下界。
    "fastmcp>=3.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
]
ignore = [
    "E501",   # line-too-long — 由 ruff formatter 处理
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N"]
