<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="400" viewBox="0 0 1200 400"
     role="img" aria-labelledby="wtitle wdesc">
  <title id="wtitle">Stata MCP Server 架构与数据流</title>
  <desc id="wdesc">Claude Agent 同时使用 stata Skill（知识层）与 stata MCP Server（执行层）。MCP 经 pystata 直接调用 Stata DLL，绕过进程开销。所有工具调用共享同一个持久 Stata 会话，数据在 use、regress、predict、export 之间保持不变。</desc>

  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#4a627d"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#f4a259"/>
    </marker>
  </defs>

  <rect width="1200" height="400" rx="24" fill="#0d1b2a"/>

  <text x="64" y="60" class="mono" font-size="19" letter-spacing="3" fill="#5aa2e8">ARCHITECTURE&#160;&#183;&#160;知识层 + 执行层</text>

  <!-- ===== Agent ===== -->
  <g class="sans" transform="translate(64 108)">
    <rect x="0" y="0" width="220" height="150" rx="14" fill="#12293f" stroke="#2f4a68" stroke-width="1.5"/>
    <text x="24" y="46" font-size="24" font-weight="700" fill="#e8eef4">Claude Code</text>
    <text x="24" y="78" font-size="24" font-weight="700" fill="#e8eef4">Agent</text>
    <text x="24" y="116" class="mono" font-size="17" fill="#8ea6c0">读知识 · 调工具</text>
  </g>

  <!-- Agent -> Skill (up) and -> MCP (down) -->
  <path d="M284 150 C 330 150, 340 118, 384 118" fill="none" stroke="#4a627d" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M284 216 C 330 216, 340 252, 384 252" fill="none" stroke="#4a627d" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== Skill (knowledge) ===== -->
  <g class="sans" transform="translate(388 74)">
    <rect x="0" y="0" width="270" height="92" rx="14" fill="#0f2135" stroke="#2a4260" stroke-width="1.5"/>
    <text x="22" y="38" font-size="22" font-weight="700" fill="#c3d3e6">stata Skill</text>
    <text x="22" y="40" class="mono" font-size="0" fill="#6f88a3"></text>
    <text x="22" y="68" class="mono" font-size="16" fill="#6f88a3">知识层 · 语法 / 模板 / 陷阱</text>
    <text x="200" y="38" class="mono" font-size="15" fill="#5a7089">.md</text>
  </g>

  <!-- ===== MCP Server (execution) ===== -->
  <g class="sans" transform="translate(388 208)">
    <rect x="0" y="0" width="270" height="92" rx="14" fill="#0f2135" stroke="#2a4260" stroke-width="1.5"/>
    <text x="22" y="38" font-size="22" font-weight="700" fill="#c3d3e6">stata MCP Server</text>
    <text x="22" y="68" class="mono" font-size="16" fill="#6f88a3">执行层 · 33 工具 · server.py</text>
  </g>

  <!-- Skill guides MCP (dashed) -->
  <path d="M523 166 L523 208" fill="none" stroke="#3a5673" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="533" y="192" class="mono" font-size="14" fill="#5a7089">指导</text>

  <!-- MCP -> pystata -->
  <path d="M658 254 L724 254" fill="none" stroke="#4a627d" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== pystata ===== -->
  <g class="sans" transform="translate(728 208)">
    <rect x="0" y="0" width="176" height="92" rx="14" fill="#0f2135" stroke="#2a4260" stroke-width="1.5"/>
    <text x="22" y="40" font-size="21" font-weight="700" fill="#c3d3e6">pystata</text>
    <text x="22" y="68" class="mono" font-size="15" fill="#6f88a3">ctypes 直连</text>
  </g>

  <!-- pystata -> DLL (amber, the in-process bridge) -->
  <path d="M904 254 L968 254" fill="none" stroke="#f4a259" stroke-width="2.5" marker-end="url(#arrowAmber)"/>

  <!-- ===== Stata DLL ===== -->
  <g class="sans" transform="translate(972 208)">
    <rect x="0" y="0" width="164" height="92" rx="14" fill="#1a1408" stroke="#f4a259" stroke-width="1.5"/>
    <text x="22" y="40" font-size="21" font-weight="700" fill="#f4a259">Stata DLL</text>
    <text x="22" y="68" class="mono" font-size="15" fill="#c79a6a">mp-64 / .dylib</text>
  </g>

  <!-- ===== persistent session band ===== -->
  <g transform="translate(64 328)">
    <rect x="0" y="0" width="1072" height="52" rx="12" fill="#0f2135" stroke="#2a4260" stroke-width="1.5"/>
    <circle cx="26" cy="26" r="6" fill="#6fcf97"/>
    <text x="46" y="32" class="sans" font-size="18" font-weight="600" fill="#c3d3e6">一个持久会话</text>
    <g class="mono" font-size="17" fill="#8ea6c0">
      <text x="196" y="32">use</text>
      <text x="262" y="32" fill="#4a627d">→</text>
      <text x="292" y="32">regress</text>
      <text x="392" y="32" fill="#4a627d">→</text>
      <text x="422" y="32">predict</text>
      <text x="520" y="32" fill="#4a627d">→</text>
      <text x="550" y="32">export</text>
    </g>
    <text x="1048" y="32" text-anchor="end" class="mono" font-size="16" fill="#6f88a3">数据跨调用保持，无需反复 use</text>
  </g>
</svg>
