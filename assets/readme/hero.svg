<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="400" viewBox="0 0 1200 400"
     role="img" aria-labelledby="title desc">
  <title id="title">Stata MCP Server + Skill for Claude Code</title>
  <desc id="desc">让 Claude Agent 直接驱动 Stata：一个持久会话跑完加载、建模、诊断与导出。右侧展示真实回归输出：regress price weight mpg，weight 系数 1.7466，R 平方 0.293，样本 74。</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1b2a"/>
      <stop offset="1" stop-color="#0a1622"/>
    </linearGradient>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    </style>
  </defs>

  <rect width="1200" height="400" rx="24" fill="url(#bg)"/>
  <!-- left accent spine: the "coefficient row" motif -->
  <rect x="0" y="24" width="6" height="352" rx="3" fill="#5aa2e8"/>

  <!-- ============ left: title block ============ -->
  <g class="sans" transform="translate(64 0)">
    <text x="0" y="80" class="mono" font-size="19" letter-spacing="3" fill="#5aa2e8">CLAUDE&#160;CODE&#160;&#183;&#160;MCP&#160;SERVER&#160;+&#160;SKILL</text>

    <text x="-2" y="158" font-size="66" font-weight="700" fill="#e8eef4">Stata MCP Server</text>

    <text x="0" y="216" font-size="27" fill="#c3d3e6">让 Claude Agent 直接驱动 Stata。</text>
    <text x="0" y="256" font-size="27" fill="#8ea6c0">一个持久会话，跑完 加载 → 建模 → 诊断 → 导出。</text>

    <!-- data-flow chain -->
    <g transform="translate(0 300)" class="mono" font-size="18">
      <rect x="0" y="-20" width="88" height="30" rx="8" fill="#12293f" stroke="#2f4a68"/>
      <text x="44" y="0" text-anchor="middle" fill="#c3d3e6">Agent</text>
      <text x="100" y="0" fill="#4a627d">→</text>
      <rect x="124" y="-20" width="72" height="30" rx="8" fill="#12293f" stroke="#2f4a68"/>
      <text x="160" y="0" text-anchor="middle" fill="#c3d3e6">MCP</text>
      <text x="208" y="0" fill="#4a627d">→</text>
      <rect x="232" y="-20" width="96" height="30" rx="8" fill="#12293f" stroke="#2f4a68"/>
      <text x="280" y="0" text-anchor="middle" fill="#c3d3e6">pystata</text>
      <text x="340" y="0" fill="#4a627d">→</text>
      <rect x="364" y="-20" width="118" height="30" rx="8" fill="#12293f" stroke="#f4a259"/>
      <text x="423" y="0" text-anchor="middle" fill="#f4a259">Stata DLL</text>
    </g>

    <text x="0" y="352" class="mono" font-size="18" fill="#5a7089">33 tools&#160;&#160;&#183;&#160;&#160;会话持久&#160;&#160;&#183;&#160;&#160;StataNow 19.5 MP</text>
  </g>

  <!-- ============ right: real regression output card ============ -->
  <g transform="translate(706 52)">
    <rect x="0" y="0" width="430" height="296" rx="16" fill="#0f2135" stroke="#2a4260" stroke-width="1.5"/>

    <!-- command line -->
    <circle cx="28" cy="34" r="5" fill="#f4a259"/>
    <text x="44" y="40" class="mono" font-size="20" fill="#e8eef4">regress price weight mpg</text>

    <line x1="24" y1="60" x2="406" y2="60" stroke="#2a4260"/>

    <!-- column header -->
    <g class="mono" font-size="17" fill="#6f88a3">
      <text x="24" y="88">price</text>
      <text x="250" y="88" text-anchor="end">Coef.</text>
      <text x="330" y="88" text-anchor="end">t</text>
      <text x="406" y="88" text-anchor="end">P&gt;|t|</text>
    </g>
    <line x1="24" y1="100" x2="406" y2="100" stroke="#1e3349" stroke-dasharray="2 3"/>

    <!-- coefficient rows -->
    <g class="mono" font-size="21">
      <text x="24" y="134" fill="#c3d3e6">weight</text>
      <text x="250" y="134" text-anchor="end" fill="#e8eef4">1.7466</text>
      <text x="330" y="134" text-anchor="end" fill="#e8eef4">2.72</text>
      <text x="406" y="134" text-anchor="end" fill="#6fcf97">0.008</text>

      <text x="24" y="172" fill="#c3d3e6">mpg</text>
      <text x="250" y="172" text-anchor="end" fill="#e8eef4">-49.51</text>
      <text x="330" y="172" text-anchor="end" fill="#e8eef4">-0.57</text>
      <text x="406" y="172" text-anchor="end" fill="#8ea6c0">0.567</text>

      <text x="24" y="210" fill="#c3d3e6">_cons</text>
      <text x="250" y="210" text-anchor="end" fill="#e8eef4">1946.1</text>
      <text x="330" y="210" text-anchor="end" fill="#e8eef4">0.54</text>
      <text x="406" y="210" text-anchor="end" fill="#8ea6c0">0.590</text>
    </g>

    <line x1="24" y1="234" x2="406" y2="234" stroke="#2a4260"/>

    <!-- footer stats -->
    <g class="mono" font-size="18" fill="#6f88a3">
      <text x="24" y="266">R&#178; = 0.293</text>
      <text x="250" y="266" text-anchor="end">N = 74</text>
      <text x="406" y="266" text-anchor="end" fill="#5a7089">auto.dta</text>
    </g>
  </g>
</svg>
