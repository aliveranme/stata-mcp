name: Publish npm + MCP Registry

# 打 v* tag 时触发，一条命令完成全部发布：
#   1. 同步 python 服务器到 npm 包
#   2. 从 tag 解析版本 → 写入 package.json 与 server.json（tag 即版本源）
#   3. npm publish（secrets.NPM_TOKEN，需 granular token + bypass 2fa）
#   4. mcp-publisher login github-oidc（GitHub Actions OIDC 认证）
#   5. mcp-publisher publish（发布到官方 MCP registry）
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write   # OIDC：registry 用 GitHub Actions OIDC 验证 io.github 命名空间

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: 同步 python 服务器到 npm 包
        working-directory: npm-package
        run: |
          rm -rf python
          mkdir -p python
          cp ../mcp-stata-server/server.py ../mcp-stata-server/stata_helpers.py python/
          cp -r ../mcp-stata-server/tool_modules python/

      - name: 同步 tag 版本到 package.json 与 server.json（tag 即版本源）
        # v1.2.3 → 1.2.3，写入三处版本：npm package.json、server.json 顶层、server.json 包内。
        # 保证「git tag == npm 包版本 == registry 版本」三者一致，杜绝漂移。
        run: |
          V="${GITHUB_REF_NAME#v}"
          node -e "const p=require('./npm-package/package.json'); p.version=process.env.V; require('fs').writeFileSync('./npm-package/package.json', JSON.stringify(p,null,2)+'\n')"
          node -e "const s=require('./server.json'); s.version=process.env.V; s.packages[0].version=process.env.V; require('fs').writeFileSync('./server.json', JSON.stringify(s,null,2)+'\n')"
          echo "=== 发布版本: $V ==="
        env:
          V: ${{ github.ref_name }}

      - name: 校验 npm 包（mcpName + 版本）
        working-directory: npm-package
        run: |
          node -e "const p=require('./package.json'); if(p.mcpName!=='io.github.aliveranme/stata-mcp'){throw new Error('mcpName 缺失')}; const expect=process.argv[1].replace(/^v/,''); if(p.version!==expect){throw new Error('版本未同步: '+p.version)}; console.log('OK:', p.mcpName, 'v'+p.version)" "${{ github.ref_name }}"
          npm pack --dry-run

      - name: 发布到 npmjs.org
        working-directory: npm-package
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: 发布到 GitHub Packages（npm，绑定本仓库）
        # 与仓库地址绑定的私有 npm registry（npm.pkg.github.com，scope @aliveranme）。
        # 用默认 GITHUB_TOKEN（需仓库 Settings→Actions→Workflow permissions 开启
        # Read and write；若被拒，错误会提示 "package does not exist / permissions"）。
        working-directory: npm-package
        run: npm publish --registry=https://npm.pkg.github.com --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 安装 mcp-publisher（下载 Linux 预构建二进制）
        # 不用 brew：GitHub Actions ubuntu 无预装 Homebrew，且 brew 安装不稳。
        # 官方在 modelcontextprotocol/registry 的 release 发布多平台预构建二进制。
        run: |
          curl -sL -o /tmp/mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.0/mcp-publisher_linux_amd64.tar.gz"
          mkdir -p /tmp/mcp-pub
          tar -xzf /tmp/mcp-publisher.tar.gz -C /tmp/mcp-pub
          sudo install -m 755 "$(find /tmp/mcp-pub -type f -name 'mcp-publisher' | head -1)" /usr/local/bin/mcp-publisher
          mcp-publisher --help >/dev/null && echo "mcp-publisher 就绪 (Linux amd64)"

      - name: 登录 MCP registry（GitHub Actions OIDC）
        run: mcp-publisher login github-oidc

      - name: 发布官方 MCP registry
        run: mcp-publisher publish
